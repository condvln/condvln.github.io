If there's no set-top box, go to the bicycle and stop. If there's no picture, go to the picture and stop. If there's no bicycle, go to the sofa and stop.", "writer": 1, "author": "TB"}, {"id": "30cc81bf62", "block": "A", "dataset": "mp3d", "episode": "479", "text": "Look for a tanning bed in the family room. If it's there then head to the coffee table. If it isn't then move to the towel in the bathroom.", "writer": 1, "author": "TB"}, {"id": "4b386797cf", "block": "A", "dataset": "replicacad", "episode": "256", "text": "First, check whether there is a sofa in the room. If there is, go to the hanger in the room if there is a basket in the room, or go to the bean bag in the room if there is not. If there is no sofa, go to the bicycle in the room if there is a picture in the room, otherwise go to the sofa in the room.", "writer": 2, "author": "NB"}, {"id": "f12107be0a", "block": "A", "dataset": "gibson", "episode": "255", "text": "If there is a vase in the living rooom, check whether there is a vase in the dining room and go to the toilet in the bathroom if so, or go to the potted plant south-west-and-down of the bed in the bedroom if not. Without a vase in the living rooom, go to the television below the tv in the home office if there is a bench in the bedroom. If there is no vase in the living rooom and no bench in the bedroom, go to the sink west of the toilet in the bathroom.", "writer": 2, "author": "NB"}, {"id": "57f725d4ae", "block": "A", "dataset": "gibson", "episode": "336", "text": "Check whether there is a potted plant near the vase in the living room. If not, go to the potted plant east-and-down of the book in the bedroom. If so, go to the book in the kitchen if there is a potted plant in the bathroom, or go to the refrigerator in the corridor otherwise.", "writer": 2, "author": "NB"}, {"id": "03db70adee", "block": "A", "dataset": "replicacad", "episode": "196", "text": "You should go to the picture in the room if there is a sofa in the room. If there is no sofa, go to the hanger in the room if there is a bin in the room. If neither a sofa nor a bin is there, check whether there is a shoe in the room and go to the bicycle in the room if there is, or go to the sofa in the room if there is not.", "writer": 2, "author": "NB"}, {"id": "58e91239d1", "block": "A", "dataset": "replicacad", "episode": "421", "text": "If there is a basket in the room, go to the bean bag in the room. If not, go to the hanger in the room.", "writer": 2, "author": "NB"}, {"id": "cf4a27d69e", "block": "A", "dataset": "replicacad", "episode": "364", "text": "If there is a shoe in the room, check whether there is a hanger in the room. In that case, go to the sofa in the room if the hanger is there, otherwise go to the picture in the room. If there is no shoe in the room, just go to the hanger in the room.", "writer": 2, "author": "NB"}, {"id": "e88c5a4e73", "block": "A", "dataset": "mp3d", "episode": "402", "text": "If there is a sink above the towel in the bathroom, go to the plant above the curtain in the bedroom if there is a shower door in the stairs, or go to the plant in the bedroom if there is not. Without that sink above the towel, go to the pillow south of the sofa chair in the bedroom.", "writer": 2, "author": "NB"}, {"id": "15006793f5", "block": "A", "dataset": "gibson", "episode": "450", "text": "You should go to the sink south-and-up of the toilet in the bathroom if there is a potted plant west-and-down of the vase in the living room, and otherwise go to the vase in the bathroom.", "writer": 2, "author": "NB"}, {"id": "85f9d1d5f8", "block": "A", "dataset": "gibson", "episode": "118", "text": "Check whether there is a television south of the tv in the living room, and if there is not, go to the backpack in the closet. If that television is there, check whether there is a vase above the tv in the living room, and if there is not, go to the tie below the suitcase in the closet. If both that television and that vase are there, go to the potted plant south of the vase in the staircase if there is a refrigerator in the staircase, or go to the television in the bedroom if there is not.", "writer": 2, "author": "NB"}, {"id": "a73909ea27", "block": "A", "dataset": "ai2thor", "episode": "63", "text": "If there is a baseball bat in the room, go to the stone statue in the room. Otherwise, if there is a pencil in the room, go to the alarm clock in the room. If neither is there, go to the bowl in the room.", "writer": 2, "author": "NB"}, {"id": "3c35536c7b", "block": "A", "dataset": "ai2thor", "episode": "87", "text": "Start by checking whether there is a candle in the room, and go to the basketball in the room if there is not. If there is a candle, look to see whether there is a cupboard in the room and go to the bottle in the room if there is not. With both a candle and a cupboard there, check whether there is a baseball bat in the room and go to the apple in the room if so, or go to the desk lamp in the room if not.", "writer": 2, "author": "NB"}, {"id": "e8baf62ed4", "block": "A", "dataset": "ai2thor", "episode": "245", "text": "If there is a candle in the room, go to the trash bin in the room. If not, check whether there is a towel statue in the room and, if so, go to the sofa in the room. If neither is there, go to the pen in the room if there is a cloth in the room, or go to the spray bottle in the room otherwise.", "writer": 2, "author": "NB"}];
const S = {who:"", i:0, A:{}}; let ORDER=[]; const KEY='condvln_v2_state';
const BYID = Object.fromEntries(ITEMS.map(x=>[x.id,x]));
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({who:S.who, i:S.i, A:S.A, order:ORDER.map(x=>x.part?{part:x.part,n:x.n,block:x.block}:x.id), t:Date.now()})); }catch(e){} }
function saved(){ try{ const v=JSON.parse(localStorage.getItem(KEY)||'null'); return v&&v.who&&v.order&&v.order.length?v:null; }catch(e){ return null; } }
function resume(){ const v=saved(); if(!v) return intro(); S.who=v.who; S.A=v.A||{}; ORDER=v.order.map(x=>typeof x==='string'?BYID[x]:x).filter(Boolean); S.i=Math.min(v.i||0, ORDER.length); render(); }
function startOver(){ if(!confirm('Start over and discard the saved progress?')) return; try{localStorage.removeItem(KEY);}catch(e){} intro(); }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function val(n){const e=document.querySelector(`input[name=${n}]:checked`);return e?e.value:null}
const $ = h => { document.getElementById('app').innerHTML = h; };
function save(){ const obj={annotator:S.who, finished:new Date().toISOString(), responses:ITEMS.map(x=>Object.assign({id:x.id,block:x.block}, S.A[x.id]||{}))};
  const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
  $(`<h2>Done, and thank you</h2><div class=card><p>Download your responses and send the file back.</p><p><a href="${url}" download="condvln_v2_${S.who.replace(/\W/g,'_')}.json"><button class=primary>Download responses</button></a></p></div>`); }
const INTRO = {A:['Rate one instruction.','How natural it sounds as something a person would say, and how clear it is where to go.'],
               B:['Compare two instructions.','Whether they send the robot to the same place in every situation.'],
               C:['Pick the destination.','Given a few facts about the house, which object the instruction sends the robot to. Everything needed is in the facts shown.']};
function introList(who){ const ord = who ? blockOrder(who) : ['A','B','C']; return ord.map((b,i)=>`<p><b>Part ${i+1}. ${INTRO[b][0]}</b> ${INTRO[b][1]}</p>`).join('') + (who ? '' : '<p class=hint>The order of the parts is set once you enter your initials below.</p>'); }
function intro(){ const v=saved(); const done=v?v.order.slice(0,v.i).filter(x=>typeof x==='string').length:0, tot=v?v.order.filter(x=>typeof x==='string').length:0;
  const resumeCard = v ? `<div class=card style="border-color:#1a1a1a"><p><b>Welcome back, ${esc(v.who)}.</b> Your saved progress: ${done} of ${tot} items done.</p><p><button class=primary onclick="resume()">Continue where I left off</button> <button onclick="startOver()">Start over</button></p></div>` : '';
  $(resumeCard+`<h2>CondVLN instruction study</h2><div class=sub>${ITEMS.length} short items in three parts, one part at a time. About 100 minutes; you can pause, nothing is timed, and Back works.</div>
<div class=card><p>You will read navigation instructions written for a robot in a house. The study has three parts, each with its own short instructions:</p>
<div id=parts>${introList("")}</div>
<p class=hint>No map or scene is shown; judge the language only. Your progress is saved in this browser after every item, so you can close the window and come back to the same link on the same device and browser to continue. Your responses download as a file at the end, nothing is uploaded automatically; please send that file to the person who gave you this link.</p>
<div class=q>Your name or initials</div><input type=text id=who placeholder="e.g. JS" style="width:260px" oninput="document.getElementById('parts').innerHTML=introList(this.value.trim())"><p><button class=primary onclick="start()" >Begin</button></p></div>`); }
const PART = {A:{title:'Rate one instruction', text:'Each item shows one instruction. Rate how natural it sounds as something a person would say, and how clear it is where to go. There are no right answers; go with your first impression.'},
              B:{title:'Compare two instructions', text:'Each item shows two instructions. Decide whether they send the robot to the same place in every situation, whatever is or is not in the house. If not, or if one can be read in two ways, say in one line which situation differs.'},
              C:{title:'Pick the destination', text:'Each item shows an instruction and a few facts about the house. Choose the object the instruction sends the robot to under those facts. Everything you need is in the facts; tick the box if the instruction allowed another reading.'}};
function hashStr(t){let h=0;for(const c of t){h=(h*31+c.charCodeAt(0))>>>0}return h}
function blockOrder(who){ const perms=[['A','B','C'],['A','C','B'],['B','A','C'],['B','C','A'],['C','A','B'],['C','B','A']]; return perms[hashStr(who.toLowerCase())%6]; }   // part order fixed per rater, balanced across raters
function build(who){ const o=[]; let n=1; for(const b of blockOrder(who)){ o.push({part:b, n:n++, block:b}); for(const it of shuffle(ITEMS.filter(x=>x.block==b))) o.push(it); } return o; }
function start(){ const v=document.getElementById('who').value.trim(); if(!v){alert('Please enter a name or initials.');return} S.who=v; ORDER=build(v); S.i=0; persist(); render(); }
function head(){ const it=ORDER[S.i], b=it.block, pn=(ORDER.find(x=>x.part==b)||{}).n||'';
  const inPart=ORDER.filter(x=>x.block==b&&!x.part).length, donePart=ORDER.slice(0,S.i).filter(x=>x.block==b&&!x.part).length;
  const tot=ORDER.filter(x=>!x.part).length, done=ORDER.slice(0,S.i).filter(x=>!x.part).length;
  return `<div class=sub style="margin-bottom:4px">Part ${pn} of 3: ${PART[b].title}</div><h2>Item ${donePart+1} of ${inPart} in this part</h2><div class=sub style="margin:2px 0 0">${inPart-donePart-1} left in this part &middot; ${tot-done-1} left in total</div><div class=bar><div style="width:${Math.round(done/tot*100)}%"></div></div>`; }
function nav(){ return `<p><button onclick="S.i--;persist();render()" ${S.i?'':'disabled'}>Back</button> <button class=primary onclick="next()">Next</button></p>`; }
function render(){ const it=ORDER[S.i]; if(!it) return save();
  if(it.part){ const p=PART[it.part], cnt=ORDER.filter(x=>x.block==it.part&&!x.part).length; $(`<h2>Part ${it.n} of 3: ${p.title}</h2><div class=card><p>${p.text}</p><p class=hint>${cnt} items in this part.</p><p><button onclick="S.i--;persist();render()" ${S.i?'':'disabled'}>Back</button> <button class=primary onclick="S.i++;persist();render()">Start part ${it.n}</button></p></div>`); return; }
  const r=S.A[it.id]||{};
  if(it.block=='A') $(head()+`<div class=card><div class=instr>${esc(it.text)}</div>
    <div class=q>1. How natural does this sound as something a person would say?</div><div class=scale>${[1,2,3,4,5].map(n=>`<label><input type=radio name=nat value=${n} ${r.nat==n?'checked':''}> ${n}</label>`).join('')}</div>
    <div class=hint>1 = nobody would say this &middot; 3 = stilted but understandable &middot; 5 = a person could have said this</div>
    <div class=q>2. How clear is it where to go?</div><div class=scale>${[1,2,3,4,5].map(n=>`<label><input type=radio name=clr value=${n} ${r.clr==n?'checked':''}> ${n}</label>`).join('')}</div>
    <div class=hint>1 = I could not tell what to do &middot; 3 = I would probably get it right &middot; 5 = I know exactly where to go in every case</div>${nav()}</div>`);
  else if(it.block=='B') $(head()+`<div class="card pair"><div class=tag>Instruction 1</div><div class=instr>${esc(it.text)}</div><div class=tag>Instruction 2</div><div class=instr>${esc(it.text2)}</div>
    <div class=q>Do these two instructions send the robot to the same place in every situation?</div>
    <label><input type=radio name=eq value=same ${r.eq=='same'?'checked':''}> Same: whatever is in the house, both end at the same object</label>
    <label><input type=radio name=eq value=different ${r.eq=='different'?'checked':''}> Different: in some situation they end at different objects</label>
    <label><input type=radio name=eq value=ambiguous ${r.eq=='ambiguous'?'checked':''}> Ambiguous: one of them can be read in more than one way</label>
    <div class=q>If Different or Ambiguous: which situation, in one line?</div><input type=text id=why value="${esc(r.why||'')}" placeholder="e.g. when the donut is there but the bed is not">${nav()}</div>`);
  else $(head()+`<div class=card><div class=instr>${esc(it.text)}</div>
    <div class=facts><b>What is true in this house:</b>${it.facts.map(f=>`<div>&middot; ${esc(f)}</div>`).join('')}</div>
    <div class=q>Given those facts, which object does the instruction send the robot to?</div>
    ${(r.opts||(r.opts=shuffle(it.options))).map(o=>`<label><input type=radio name=opt value="${esc(o)}" ${r.pick==o?'checked':''}> ${esc(o)}</label>`).join('')}
    <label style="margin-top:14px"><input type=checkbox id=unclear ${r.unclear?'checked':''}> The instruction allowed another reading (tick if you hesitated)</label>${nav()}</div>`);
  S.A[it.id]=r; }
function next(){ const it=ORDER[S.i]; if(it.part){S.i++;render();return} const r=S.A[it.id]||{};
  if(it.block=='A'){ const n=val('nat'), c=val('clr'); if(!n||!c){alert('Please answer both questions.');return} r.nat=+n; r.clr=+c; }
  else if(it.block=='B'){ const e=val('eq'); if(!e){alert('Please choose one.');return} r.eq=e; r.why=document.getElementById('why').value.trim(); if(e!='same'&&!r.why){alert('One line on which situation differs, please.');return} }
  else { const p=val('opt'); if(!p){alert('Please choose an option.');return} r.pick=p; r.unclear=document.getElementById('unclear').checked; }
  S.A[it.id]=r; S.i++; persist(); render(); }
const pv=new URLSearchParams(location.search).get('preview');
if(pv){ S.who='preview'; ORDER=ITEMS.filter(x=>x.block==pv); S.i=0; render(); } else intro();   // the intro shows a resume card when saved progress exists
</script>
