function val(n){const e=document.querySelector(`input[name=${n}]:checked`);return e?e.value:null}
const $ = h => { document.getElementById('app').innerHTML = h; };
function save(){ const obj={annotator:S.who, finished:new Date().toISOString(), responses:ITEMS.map(x=>Object.assign({id:x.id,block:x.block}, S.A[x.id]||{}))};
  const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
  $(`<h2>Done, and thank you</h2><div class=card><p>Download your responses and send the file back.</p><p><a href="${url}" download="condvln_v2_${S.who.replace(/\W/g,'_')}.json"><button class=primary>Download responses</button></a></p></div>`); }
function intro(){ $(`<h2>CondVLN instruction study</h2><div class=sub>${ITEMS.length} short items of three kinds, mixed. About 75 minutes; you can pause, nothing is timed, and Back works.</div>
<div class=card><p>You will read navigation instructions written for a robot in a house. Three kinds of items come up in mixed order:</p>
<p><b>Rate one instruction.</b> How natural it sounds as something a person would say, and how clear it is where to go.</p>
<p><b>Compare two instructions.</b> Whether they send the robot to the same place in every situation.</p>
<p><b>Pick the destination.</b> Given a few facts about the house, which object the instruction sends the robot to. Everything needed is in the facts shown.</p>
<p class=hint>No map or scene is shown; judge the language only. Your responses download as a file at the end, nothing is uploaded automatically; please send that file to the person who gave you this link.</p>
<p style="background:#fff3f3;border:1px solid #f0b4b4;border-radius:6px;padding:10px 14px"><b>Not open yet.</b> The rating phase starts after the writing phase; this page will be updated in place. Please come back when you are told it is open.</p><div class=q>Your name or initials</div><input type=text id=who placeholder="e.g. JS" style="width:260px"><p><button class=primary onclick="start()" disabled>Begin</button></p></div>`); }

function render(){ const it=ORDER[S.i]; if(!it) return save(); const r=S.A[it.id]||{};

    <div class=q>1. How natural does this sound as something a person would say?</div><div class=scale>${[1,2,3,4,5].map(n=>`<label><input type=radio name=nat value=${n} ${r.nat==n?'checked':''}> ${n}</label>`).join('')}</div>
    <div class=hint>1 = nobody would say this &middot; 3 = stilted but understandable &middot; 5 = a person could have said this</div>
    <div class=q>2. How clear is it where to go?</div><div class=scale>${[1,2,3,4,5].map(n=>`<label><input type=radio name=clr value=${n} ${r.clr==n?'checked':''}> ${n}</label>`).join('')}</div>
