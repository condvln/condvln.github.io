<!doctype html><meta charset="utf-8"><title>Writing conditional instructions</title><style>
body{font:16px/1.55 system-ui,sans-serif;max-width:780px;margin:0 auto;padding:24px;color:#1a1a1a} h2{margin:0 0 4px} .sub{color:#666;font-size:14px;margin-bottom:22px}
.card{border:1px solid #ddd;border-radius:10px;padding:20px;margin:16px 0;background:#fff} .q{font-weight:600;margin:16px 0 6px} .hint{color:#666;font-size:13px}
pre{font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#f6f7f9;border-left:4px solid #888;padding:12px 16px;border-radius:6px;white-space:pre-wrap;margin:8px 0 14px}
.kw{display:inline-block;background:#eef3ff;border:1px solid #c9d6f5;border-radius:6px;padding:2px 8px;margin:3px 4px 3px 0;font-size:15px}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:110px;padding:10px;border:1px solid #ccc;border-radius:6px}
button{font:inherit;padding:9px 18px;border-radius:7px;border:1px solid #bbb;background:#fff;cursor:pointer} button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a} button:disabled{opacity:.4;cursor:not-allowed}
.bar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:14px 0} .bar>div{height:100%;background:#1a1a1a}
.rules{background:#fffdf2;border:1px solid #e8dfae;border-radius:6px;padding:10px 14px;font-size:14.5px;color:#4a4a2a;margin-bottom:6px}
</style><div id=app></div><script>
const ITEMS = [{"id": "67c60bbddd", "spec": "IF there is a armchair far from the stool in family room THEN (\nIF there is a towel near the heater in bathroom THEN (\nIF there is a tablet in bedroom THEN go to the pillow east of the bed in bedroom \nELSE go to the armchair in dining room) \nELSE go to the toilet in bathroom) \nELSE go to the tablet in bathroom", "objects": ["armchair far from the stool", "towel near the heater", "tablet", "pillow east of the bed", "armchair", "toilet"], "rooms": ["family room", "bathroom", "bedroom", "dining room"]}, {"id": "46a7320bec", "spec": "IF there is a box in utility room THEN (\nIF there is a clothes in closet THEN go to the fan in hallway \nELSE go to the box in kitchen) \nELSE (\nIF there is a kitchen island in kitchen THEN go to the plant below the dining chair in kitchen \nELSE go to the toilet in bathroom)", "objects": ["box", "clothes", "fan", "kitchen island", "plant below the dining chair", "toilet"], "rooms": ["utility room", "closet", "hallway", "kitchen", "bathroom"]}, {"id": "e4309e79cb", "spec": "IF there is a microwave in bathroom THEN go to the plant far from the lamp in entryway \nELSE \nIF there is a bucket in living room THEN go to the table lamp above the plant in office \nELSE go to the table lamp above the cabinet in bedroom", "objects": ["microwave", "plant far from the lamp", "bucket", "table lamp above the plant", "table lamp above the cabinet"], "rooms": ["bathroom", "entryway", "living room", "office", "bedroom"]}, {"id": "c0d3afc697", "spec": "IF there is a coffee table in room THEN (\nIF there is a apple in room THEN go to the pillow in room \nELSE go to the pen in room) \nELSE (\nIF there is a spray bottle in room THEN go to the basketball in room \nELSE go to the sofa in room)", "objects": ["coffee table", "apple", "pillow", "pen", "spray bottle", "basketball", "sofa"], "rooms": []}, {"id": "5b6b7bdaae", "spec": "IF there is a stool in room THEN go to the hanger in room \nELSE \nIF there is a bicycle in room THEN go to the sofa in room \nELSE go to the bicycle in room", "objects": ["stool", "hanger", "bicycle", "sofa"], "rooms": []}, {"id": "f730266e3b", "spec": "IF there is a bread in room THEN go to the cup in room \nELSE go to the spray bottle in room", "objects": ["bread", "cup", "spray bottle"], "rooms": []}, {"id": "a0bc23ae54", "spec": "IF there is a chair in room THEN (\nIF there is a bottle in room THEN go to the desk lamp in room \nELSE go to the houseplant in room) \nELSE go to the armchair in room", "objects": ["chair", "bottle", "desk lamp", "houseplant", "armchair"], "rooms": []}, {"id": "81db6756a3", "spec": "IF there is a refrigerator in closet THEN go to the potted plant in bedroom \nELSE \nIF there is a microwave in lobby THEN go to the bed in bedroom \nELSE \nIF there is a keyboard in living room THEN go to the sandwich in pantry \nELSE go to the umbrella in bathroom", "objects": ["refrigerator", "potted plant", "microwave", "bed", "keyboard", "sandwich", "umbrella"], "rooms": ["closet", "bedroom", "lobby", "living room", "pantry", "bathroom"]}, {"id": "d6ddd6ddb4", "spec": "IF there is a microwave in hallway THEN go to the bathtub in bathroom \nELSE \nIF there is a urinal in hallway THEN go to the towel above the mirror in bathroom \nELSE \nIF there is a bookshelf in dining room THEN go to the curtain below the bench in bedroom \nELSE go to the curtain in living room", "objects": ["microwave", "bathtub", "urinal", "towel above the mirror", "bookshelf", "curtain below the bench", "curtain"], "rooms": ["hallway", "bathroom", "dining room", "bedroom", "living room"]}, {"id": "c2b4d2e7c9", "spec": "IF there is a baseball glove in bathroom THEN go to the potted plant in bathroom \nELSE \nIF there is a potted plant in bedroom THEN go to the book in living room \nELSE go to the umbrella in bathroom", "objects": ["baseball glove", "potted plant", "book", "umbrella"], "rooms": ["bathroom", "bedroom", "living room"]}, {"id": "b9f799e6bb", "spec": "IF there is a set-top box in room THEN (\nIF there is a picture in room THEN (\nIF there is a bicycle in room THEN go to the hanger in room \nELSE go to the sofa in room) \nELSE go to the picture in room) \nELSE go to the bicycle in room", "objects": ["set-top box", "picture", "bicycle", "hanger", "sofa"], "rooms": []}, {"id": "87c5e19834", "spec": "IF there is a tanning bed in family room THEN go to the coffee table in family room \nELSE go to the towel in bathroom", "objects": ["tanning bed", "coffee table", "towel"], "rooms": ["family room", "bathroom"]}]; const WRITER = 1; const S = {who:"", i:0, A:{}};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const $ = h => { document.getElementById('app').innerHTML = h; };
function intro(){ $(`<h2>Writing conditional instructions</h2><div class=sub>${ITEMS.length} items, about 25 minutes. Nothing is timed; Back works.</div><div class=card>
<p>Each item shows the <b>logic</b> of a navigation instruction for a robot in a house: conditions about objects, and where to go in each case. Write the instruction the way you would say it to a person, in one to three sentences.</p>
<p><b>Two rules.</b> (1) Keep the logic exactly: the same conditions, each deciding between the same two outcomes, every "otherwise" case with its own destination. (2) Use each listed phrase word for word (you may add "a" or "the"). Everything else, wording and order, is yours.</p>
<p class=hint>Do not describe a route; there is no map. Only the conditions and the destinations matter. Your answers download as a file at the end; please send that file to the person who gave you this link.</p>
<div class=q>Your name or initials</div><input type=text id=who placeholder="e.g. JS" style="font:inherit;padding:8px;border:1px solid #ccc;border-radius:6px;width:260px"><p><button class=primary onclick="start()">Begin</button></p></div>`); }
function start(){ const v=document.getElementById('who').value.trim(); if(!v){alert('Please enter a name or initials.');return} S.who=v; S.i=0; render(); }
function render(){ const it=ITEMS[S.i]; if(!it){ const obj={writer:WRITER, annotator:S.who, finished:new Date().toISOString(), responses:ITEMS.map(x=>({id:x.id, text:(S.A[x.id]||"")}))};
    const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}));
    return $(`<h2>Done, and thank you</h2><div class=card><p>Download your instructions and send the file back.</p><p><a href="${url}" download="condvln_written_W${WRITER}_${S.who.replace(/\W/g,'_')}.json"><button class=primary>Download</button></a></p></div>`); }
  $(`<h2>Item ${S.i+1} of ${ITEMS.length}</h2><div class=bar><div style="width:${Math.round(S.i/ITEMS.length*100)}%"></div></div><div class=card>
  <div class=rules><b>Two rules.</b> (1) Keep the logic exactly: the same conditions, each deciding between the same two outcomes, and every "otherwise" case keeps its own destination. (2) Use each listed phrase word for word; adding "a" or "the" is fine. Write it as you would say it to a person, one to three sentences.</div>
  <div class=q>The logic</div><pre>${esc(it.spec)}</pre>
  <div class=q>Phrases to use word for word</div><div>${it.objects.map(o=>`<span class=kw>${esc(o)}</span>`).join('')}${it.rooms.map(r=>`<span class=kw>${esc(r)}</span>`).join('')}</div>
  <div class=q>Your instruction</div><textarea id=txt placeholder="If you ...">${esc(S.A[it.id]||'')}</textarea>
  <p><button onclick="S.A[ITEMS[S.i].id]=document.getElementById('txt').value; S.i--; render()" ${S.i?'':'disabled'}>Back</button> <button class=primary onclick="next()">Next</button></p></div>`); }
function next(){ const it=ITEMS[S.i], t=document.getElementById('txt').value.trim(); if(t.split(/\s+/).length<6){alert('Please write the full instruction.');return}
  const miss=[...it.objects,...it.rooms].filter(p=>!t.toLowerCase().includes(p.toLowerCase())); if(miss.length){alert('Please use these phrases word for word: '+miss.join(', '));return}
  S.A[it.id]=t; S.i++; render(); }
intro();
</script>
